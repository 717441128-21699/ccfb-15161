<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>磁带录音修复工具</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.6 system-ui, "Microsoft YaHei", sans-serif; background: #0b0e12; color: #d7e0ea; }
  nav { display: flex; gap: 4px; padding: 10px 16px; background: #131922; border-bottom: 1px solid #232c38; }
  nav button { background: none; border: 1px solid transparent; color: #9fb2c8; padding: 8px 18px; cursor: pointer; border-radius: 6px; font-size: 14px; }
  nav button.on { background: #1d2836; color: #6ec1ff; border-color: #2c3c50; }
  main { max-width: 960px; margin: 0 auto; padding: 20px 16px 60px; }
  h2 { margin: 0 0 16px; font-size: 20px; }
  h3 { margin: 22px 0 10px; font-size: 15px; color: #8fa5bd; }
  h4 { margin: 16px 0 6px; font-size: 13px; color: #8fa5bd; }
  .card { background: #131922; border: 1px solid #232c38; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .form label { display: block; margin-bottom: 10px; color: #9fb2c8; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
  .row label { flex: 1; min-width: 180px; }
  input, select, textarea { width: 100%; background: #0b0e12; color: #d7e0ea; border: 1px solid #2c3c50; border-radius: 4px; padding: 7px 9px; font: inherit; }
  input[type="file"], input[type="checkbox"] { width: auto; }
  button { background: #1f6feb; color: #fff; border: none; border-radius: 6px; padding: 8px 20px; cursor: pointer; font-size: 14px; margin-top: 6px; }
  button:disabled { background: #2c3c50; color: #7b8a9c; cursor: default; }
  button.link { background: none; color: #6ec1ff; padding: 0 4px; margin: 0; }
  .hint { color: #7b8a9c; font-size: 13px; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tbl th, .tbl td { text-align: left; padding: 7px 10px; border-bottom: 1px solid #232c38; }
  .tbl th { color: #8fa5bd; font-weight: normal; }
  .kv { border-collapse: collapse; }
  .kv td { padding: 4px 14px 4px 0; vertical-align: top; }
  .kv td:first-child { color: #8fa5bd; white-space: nowrap; }
  .prog { height: 8px; background: #0b0e12; border-radius: 4px; margin-top: 12px; overflow: hidden; }
  .prog div { height: 100%; width: 0; background: #1f6feb; transition: width .2s; }
  canvas { width: 100%; border-radius: 6px; border: 1px solid #232c38; }
  .ab { display: flex; gap: 8px; margin-bottom: 12px; }
  .abBtn { flex: 1; padding: 14px; font-size: 16px; background: #1a2330; color: #9fb2c8; border: 1px solid #2c3c50; }
  .abBtn.on { background: #1f6feb; color: #fff; border-color: #1f6feb; }
</style>
</head>
<body>
<nav>
  <button data-page="register">磁带登记</button>
  <button data-page="process">修复处理</button>
  <button data-page="listen">试听对比</button>
  <button data-page="archive">归档</button>
</nav>
<main id="app"></main>
<script type="module" src="./dist/src/ui/main.js"></script>
</body>
</html>
